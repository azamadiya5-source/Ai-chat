<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI</title>

<style>
:root{
  --bg:#fff;
  --panel:#f7f7f8;
  --ink:#1a1a1a;
  --muted:#6e6e6e;
  --border:#e5e5e5;
  --user:#f1f1f1;
  --hover:#ececec;
  --accent:#111;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
}

body{
  background:var(--bg);
  overflow:hidden;
}

/* APP */

.app{
  width:100%;
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:12px;
  display:flex;
  flex-direction:column;
  transition:.25s;
}

.new-chat{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.new-chat:hover{
  background:var(--hover);
}

.history-title{
  font-size:12px;
  color:var(--muted);
  margin:22px 8px 8px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:10px 12px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:var(--hover);
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:58px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 18px;
  justify-content:space-between;
  background:var(--bg);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:600;
}

.logo{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

.header-right{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  border-radius:9px;
  cursor:pointer;
  font-size:17px;
}

.icon-btn:hover{
  background:var(--hover);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  scroll-behavior:smooth;
  padding:30px 18px 20px;
}

.chat-inner{
  max-width:760px;
  margin:auto;
}

/* WELCOME */

.welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.welcome-logo{
  width:54px;
  height:54px;
  border-radius:16px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  margin-bottom:18px;
}

.welcome h1{
  font-size:28px;
  margin:0 0 8px;
}

.welcome p{
  margin:0;
  color:var(--muted);
}

/* MESSAGE */

.message{
  display:flex;
  gap:12px;
  margin:0 auto 26px;
  max-width:760px;
}

.message.user{
  justify-content:flex-end;
}

.message .avatar{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  background:#111;
  color:white;
}

.message.user .avatar{
  background:#2563eb;
}

.message-content{
  max-width:82%;
  font-size:15px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .message-content{
  background:var(--user);
  padding:11px 15px;
  border-radius:18px;
}

.message.bot .message-content{
  padding-top:5px;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.action{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  padding:5px 7px;
  border-radius:6px;
  font-size:12px;
}

.action:hover{
  background:var(--hover);
}

/* TYPING */

.typing{
  display:flex;
  gap:4px;
  padding-top:10px;
}

.dot{
  width:6px;
  height:6px;
  background:#777;
  border-radius:50%;
  animation:bounce 1.2s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-5px);opacity:1}
}

/* COMPOSER */

.composer{
  padding:12px 18px 18px;
}

.composer-inner{
  max-width:760px;
  margin:auto;
}

form{
  border:1px solid #d5d5d5;
  border-radius:18px;
  padding:8px 9px 8px 15px;
  display:flex;
  align-items:flex-end;
  background:white;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  font:inherit;
  font-size:15px;
  line-height:1.45;
  max-height:180px;
  min-height:24px;
  padding:7px 0;
}

.send{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#111;
  color:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.send:disabled{
  background:#d0d0d0;
  cursor:default;
}

.disclaimer{
  text-align:center;
  color:#999;
  font-size:11px;
  margin-top:8px;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-270px;
    top:0;
    bottom:0;
    z-index:10;
    box-shadow:4px 0 20px rgba(0,0,0,.12);
  }

  .sidebar.open{
    left:0;
  }

  .header{
    padding:0 12px;
  }

  .chat{
    padding:20px 12px;
  }

  .message-content{
    max-width:90%;
  }

  .welcome h1{
    font-size:24px;
  }

  .composer{
    padding:8px 10px 12px;
  }
}

/* DARK */

body.dark{
  --bg:#212121;
  --panel:#171717;
  --ink:#eee;
  --muted:#aaa;
  --border:#383838;
  --user:#303030;
  --hover:#333;
  --accent:#fff;
}

body.dark .new-chat,
body.dark form{
  background:#2a2a2a;
}

body.dark .logo,
body.dark .welcome-logo{
  background:#fff;
  color:#111;
}

body.dark .send{
  background:#fff;
  color:#111;
}

body.dark textarea{
  color:#eee;
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <button class="new-chat" id="newChat">
      ＋ Chat baru
    </button>

    <div class="history-title">
      RIWAYAT CHAT
    </div>

    <div class="history" id="history"></div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="header">

      <div class="brand">

        <button
          class="icon-btn"
          id="menuBtn"
          aria-label="Menu"
        >☰</button>

        <div class="logo">AI</div>

        <span>My AI</span>

      </div>

      <div class="header-right">

        <button
          class="icon-btn"
          id="themeBtn"
          title="Tema"
        >☾</button>

      </div>

    </header>

    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            AI
          </div>

          <h1>Ada yang bisa saya bantu?</h1>

          <p>Tanyakan apa saja untuk memulai percakapan.</p>

        </div>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer">

      <div class="composer-inner">

        <form id="form">

          <textarea
            id="input"
            rows="1"
            placeholder="Kirim pesan..."
            autocomplete="off"
          ></textarea>

          <button
            class="send"
            id="send"
            type="submit"
            disabled
            aria-label="Kirim"
          >
            ↑
          </button>

        </form>

        <div class="disclaimer">
          My AI dapat membuat kesalahan. Periksa informasi penting.
        </div>

      </div>

    </div>

  </main>

</div>


<script>

/* =========================
   ELEMENT
========================= */

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const welcome = document.getElementById("welcome");

const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");

const themeBtn = document.getElementById("themeBtn");
const newChat = document.getElementById("newChat");
const history = document.getElementById("history");


/* =========================
   CHAT DATA
========================= */

let messages = [];

let conversations =
  JSON.parse(localStorage.getItem("myAI_history") || "[]");


/* =========================
   SIDEBAR
========================= */

function renderHistory(){

  history.innerHTML = "";

  conversations
    .slice()
    .reverse()
    .forEach((conversation,index)=>{

      const item =
        document.createElement("div");

      item.className = "history-item";

      item.textContent =
        conversation.title || "Chat baru";

      item.onclick = ()=>{

        loadConversation(
          conversations.length - 1 - index
        );

        sidebar.classList.remove("open");

      };

      history.appendChild(item);

    });

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, role){

  if(welcome){
    welcome.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + role;

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    role === "user" ? "U" : "AI";

  const wrapper =
    document.createElement("div");

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.textContent = text;

  wrapper.appendChild(content);

  if(role === "bot"){

    const actions =
      document.createElement("div");

    actions.className = "actions";

    const copy =
      document.createElement("button");

    copy.className = "action";

    copy.textContent = "Salin";

    copy.onclick = async ()=>{

      await navigator.clipboard.writeText(text);

      copy.textContent = "Tersalin ✓";

      setTimeout(()=>{
        copy.textContent = "Salin";
      },1500);

    };

    actions.appendChild(copy);

    wrapper.appendChild(actions);

  }

  message.appendChild(avatar);
  message.appendChild(wrapper);

  chatInner.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

  return content;
}


/* =========================
   TYPING
========================= */

function addTyping(){

  if(welcome){
    welcome.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    "message bot";

  message.id =
    "typingMessage";

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";
  avatar.textContent = "AI";

  const wrapper =
    document.createElement("div");

  const typing =
    document.createElement("div");

  typing.className = "typing";

  typing.innerHTML =
    "<span class='dot'></span>" +
    "<span class='dot'></span>" +
    "<span class='dot'></span>";

  wrapper.appendChild(typing);

  message.appendChild(avatar);
  message.appendChild(wrapper);

  chatInner.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


function removeTyping(){

  const typing =
    document.getElementById("typingMessage");

  if(typing) typing.remove();

}


/* =========================
   SEND MESSAGE
========================= */

form.addEventListener("submit", async(e)=>{

  e.preventDefault();

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  messages.push({
    role:"user",
    content:text
  });

  input.value = "";

  autoResize();
  updateButton();

  send.disabled = true;

  addTyping();

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:text,
          messages:messages
        })

      });

    const data =
      await response.json();

    removeTyping();

    if(!response.ok){

      throw new Error(
        data.error || "Server error"
      );

    }

    const reply =
      data.reply ||
      "AI tidak memberikan jawaban.";

    addMessage(reply,"bot");

    messages.push({
      role:"assistant",
      content:reply
    });

    saveConversation();

  }catch(error){

    removeTyping();

    addMessage(
      "❌ Gagal menghubungi AI.\n\n" +
      error.message,
      "bot"
    );

  }

  send.disabled = false;

  updateButton();

  input.focus();

});


/* =========================
   SAVE CHAT
========================= */

function saveConversation(){

  if(messages.length === 0) return;

  const first =
    messages.find(x=>x.role==="user");

  const title =
    first
      ? first.content.slice(0,35)
      : "Chat baru";

  conversations.push({
    title:title,
    messages:[...messages]
  });

  /*
    Hindari menyimpan terlalu banyak
    percakapan di browser.
  */

  if(conversations.length > 30){
    conversations.shift();
  }

  localStorage.setItem(
    "myAI_history",
    JSON.stringify(conversations)
  );

  renderHistory();

}


/* =========================
   LOAD CHAT
========================= */

function loadConversation(index){

  const conversation =
    conversations[index];

  if(!conversation) return;

  chatInner.innerHTML = "";

  messages =
    [...conversation.messages];

  messages.forEach(msg=>{

    addMessage(
      msg.content,
      msg.role === "user"
        ? "user"
        : "bot"
    );

  });

}


/* =========================
   NEW CHAT
========================= */

newChat.onclick = ()=>{

  messages = [];

  chatInner.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="welcome-logo">
        AI
      </div>

      <h1>Ada yang bisa saya bantu?</h1>

      <p>
        Tanyakan apa saja untuk memulai percakapan.
      </p>

    </div>
  `;

  sidebar.classList.remove("open");

  input.focus();

};


/* =========================
   MENU
========================= */

menuBtn.onclick = ()=>{

  sidebar.classList.toggle("open");

};


/* =========================
   DARK MODE
========================= */

let dark =
  localStorage.getItem("myAI_dark") === "true";

function applyTheme(){

  document.body.classList.toggle(
    "dark",
    dark
  );

  themeBtn.textContent =
    dark ? "☀" : "☾";

}

themeBtn.onclick = ()=>{

  dark = !dark;

  localStorage.setItem(
    "myAI_dark",
    dark
  );

  applyTheme();

};


/* =========================
   TEXTAREA
========================= */

function autoResize(){

  input.style.height = "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      180
    ) + "px";

}


function updateButton(){

  send.disabled =
    input.value.trim().length === 0;

}


input.addEventListener(
  "input",
  ()=>{
    autoResize();
    updateButton();
  }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      if(
        input.value.trim()
      ){
        form.requestSubmit();
      }

    }

  }
);


/* =========================
   START
========================= */

renderHistory();
applyTheme();
updateButton();

input.focus();

</script>

</body>
  </html>
